name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Yarn
        uses: corepack/action-setup@v4
        with:
          package-manager: yarn

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies using yarn.lock
        run: yarn install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: yarn electron-builder install-app-deps

      - name: Build Windows NSIS installer (.exe)
        run: yarn build:win

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduManager-Windows-EXE
          path: |
            release/*.exe
            release/latest.yml
